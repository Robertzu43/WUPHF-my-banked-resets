name: Draft unsigned beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease VERSION (for example 0.1.0-beta.1)
        required: true
        type: string
      commit:
        description: Full lowercase 40-character commit SHA on the default branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard immutable selection and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from scripts.release_assets import validate_commit, validate_version
          validate_commit(os.environ['RELEASE_COMMIT'])
          validate_version(os.environ['RELEASE_VERSION'])
          PY
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          # GITHUB_TOKEN cannot create a release if target workflow files differ from default.
          git diff --exit-code "$RELEASE_COMMIT" HEAD -- .github/workflows
          git checkout --detach "$RELEASE_COMMIT"
          python scripts/release_assets.py validate --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
  build:
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      commit: ${{ inputs.commit }}
      version: ${{ inputs.version }}
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-wuphf-*
          path: artifacts
      - name: Verify archives and combine download checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: python scripts/release_assets.py assemble artifacts --output release --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-assets
          path: release
      - name: Create draft prerelease only after every build and verification passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          existing_tags=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          while IFS= read -r existing_tag; do
            if [ "$existing_tag" = "v$RELEASE_VERSION" ]; then
              echo "A draft or published release already uses this version; review it before retrying." >&2
              exit 1
            fi
          done <<< "$existing_tags"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            tag_commit=$(git rev-parse --verify "refs/tags/v$RELEASE_VERSION^{commit}")
            if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
              echo "Existing tag points at another commit; refusing a mismatched release." >&2
              exit 1
            fi
          fi
          gh release create "v$RELEASE_VERSION" release/* --draft --prerelease --latest=false --target "$RELEASE_COMMIT" --title "WUPHF $RELEASE_VERSION (unsigned beta)" --notes "Unsigned and unnotarized beta built from $RELEASE_COMMIT. Review the changelog, release readiness report, platform support, and remaining release gates before publication. SHA256SUMS contains hashes for the three downloadable archives. Google verification and real-device delivery are not established by these builds."
