name: Prototype packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install 'pyinstaller>=6.17,<7' -r requirements.txt
      - name: Build one-folder prototype
        run: python scripts/build_package.py --output "${{ runner.temp }}/wuphf-dist" --work "${{ runner.temp }}/wuphf-build"
      - name: Check assets and isolated background mode
        run: python scripts/smoke_package.py "${{ runner.temp }}/wuphf-dist/WUPHF"
      - name: Archive POSIX package with symlinks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/wuphf-beta.tar.gz" -C "$RUNNER_TEMP/wuphf-dist" WUPHF
          mkdir "$RUNNER_TEMP/wuphf-extracted"
          tar -xzf "$RUNNER_TEMP/wuphf-beta.tar.gz" -C "$RUNNER_TEMP/wuphf-extracted"
          python scripts/smoke_package.py "$RUNNER_TEMP/wuphf-extracted/WUPHF"
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:RUNNER_TEMP\wuphf-dist\WUPHF" -DestinationPath "$env:RUNNER_TEMP\wuphf-beta.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wuphf-beta.zip" -DestinationPath "$env:RUNNER_TEMP\wuphf-extracted"
          python scripts/smoke_package.py "$env:RUNNER_TEMP\wuphf-extracted\WUPHF"
      - name: Write archive checksum
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / ('wuphf-beta.zip' if os.name == 'nt' else 'wuphf-beta.tar.gz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (root / 'SHA256SUMS').write_text(digest + '  ' + archive.name + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-wuphf-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/wuphf-beta.*
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
