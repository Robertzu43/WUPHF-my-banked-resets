name: Prototype packages

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release checkout
        if: inputs.commit != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: python scripts/release_assets.py validate --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - name: Install build dependencies
        run: python -m pip install 'pyinstaller>=6.17,<7' -r requirements.txt
      - name: Test selected commit
        run: python -m unittest discover -s tests -v
      - name: Build one-folder prototype
        run: python scripts/build_package.py --output "${{ runner.temp }}/wuphf-dist" --work "${{ runner.temp }}/wuphf-build"
      - name: Check assets and isolated background mode
        run: python scripts/smoke_package.py "${{ runner.temp }}/wuphf-dist/WUPHF"
      - name: Archive unsigned package
        run: python scripts/release_assets.py archive "${{ runner.temp }}/wuphf-dist/WUPHF" --output "${{ runner.temp }}/wuphf-assets"
      - name: Extract POSIX package with symlinks and smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/wuphf-extracted"
          tar -xzf "$RUNNER_TEMP"/wuphf-assets/*.tar.gz -C "$RUNNER_TEMP/wuphf-extracted"
          python scripts/smoke_package.py "$RUNNER_TEMP/wuphf-extracted/WUPHF"
      - name: Extract Windows package and smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem "$env:RUNNER_TEMP\wuphf-assets\*.zip").FullName -DestinationPath "$env:RUNNER_TEMP\wuphf-extracted"
          python scripts/smoke_package.py "$env:RUNNER_TEMP\wuphf-extracted\WUPHF"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-wuphf-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/wuphf-assets/*
          if-no-files-found: error
          retention-days: 7
